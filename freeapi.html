<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books API</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

img{
    width:180px;
    height:250px;
    object-fit:cover;
    border-radius:10px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#388E3C;
}
</style>

</head>
<body>

<div class="card">

    <img id="bookImage" src="" alt="Book Cover">

    <h2 id="title">Loading...</h2>

    <p id="author"></p>

    <p id="publisher"></p>

    <button onclick="getBook()">Next Book</button>

</div>

<script>

async function getBook(){

    const response = await fetch("https://api.freeapi.app/api/v1/public/books");

    const result = await response.json();

    const books = result.data.data;

    const random = Math.floor(Math.random() * books.length);

    const book = books[random];

    document.getElementById("bookImage").src =
        book.volumeInfo.imageLinks.thumbnail;

    document.getElementById("title").innerText =
        book.volumeInfo.title;

    document.getElementById("author").innerText =
        "Author: " + book.volumeInfo.authors.join(", ");

    document.getElementById("publisher").innerText =
        "Publisher: " + book.volumeInfo.publisher;
}

getBook();

</script>

</body>
</html>
